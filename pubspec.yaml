name: a_word_from_mother
description: A local-first Android app that sends occasional mom-like messages.
publish_to: none
version: 0.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: 5.1.0
  intl: any
  shared_preferences: 2.5.5
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/messages.json
